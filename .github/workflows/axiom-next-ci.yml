name: AXIOM NEXT - Stride Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'AxiomNext/**'
      - '.github/workflows/axiom-next-ci.yml'
      - '.gitignore'

permissions:
  contents: write

concurrency:
  group: axiom-next-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Verify gameplay and build Stride Android APK
    runs-on: ubuntu-latest
    env:
      DOTNET_NUGET_SIGNATURE_VERIFICATION: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify core gameplay rules
        run: dotnet run --project AxiomNext/src/AxiomNext.Core.Tests/AxiomNext.Core.Tests.csproj --configuration Release

      - name: Install native libraries required by Stride asset compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1 libfreetype6 libopenal1 libsdl2-2.0-0 libvulkan1 mesa-vulkan-drivers

      - name: Install Android workload
        run: dotnet workload install android

      - name: Install Stride game template
        run: dotnet new install Stride.Templates.Games@4.4.3

      - name: Generate Stride Android project if it does not exist yet
        shell: bash
        run: |
          mkdir -p AxiomNext/StrideProject
          if find AxiomNext/StrideProject -name '*.Android.csproj' -print -quit | grep -q .; then
            echo "Using the Stride project already stored in the repository."
          else
            dotnet new stride-game -n AxiomNext --output AxiomNext/StrideProject --platforms host android --orientation LandscapeLeft
          fi

      - name: Connect shared C# game logic
        shell: bash
        run: |
          GAME_PROJECT="$(find AxiomNext/StrideProject -name '*.Game.csproj' -print -quit)"
          if [ -z "$GAME_PROJECT" ]; then
            echo "Stride game project was not found."
            find AxiomNext/StrideProject -maxdepth 4 -type f
            exit 1
          fi
          if ! grep -q 'AxiomNext.Core.csproj' "$GAME_PROJECT"; then
            CORE_PROJECT="$GITHUB_WORKSPACE/AxiomNext/src/AxiomNext.Core/AxiomNext.Core.csproj"
            RELATIVE_CORE="$(realpath --relative-to="$(dirname "$GAME_PROJECT")" "$CORE_PROJECT")"
            (cd "$(dirname "$GAME_PROJECT")" && dotnet add "$(basename "$GAME_PROJECT")" reference "$RELATIVE_CORE")
          fi

      - name: Restore and publish Android APK
        shell: bash
        run: |
          ANDROID_PROJECT="$(find AxiomNext/StrideProject -name '*.Android.csproj' -print -quit)"
          if [ -z "$ANDROID_PROJECT" ]; then
            echo "Stride Android project was not found."
            find AxiomNext/StrideProject -maxdepth 5 -type f
            exit 1
          fi
          dotnet publish "$ANDROID_PROJECT" --configuration Release -p:AndroidPackageFormat=apk -p:StrideCompileAssets=false --verbosity normal

      - name: Archive Stride source when Android build fails
        if: failure()
        run: tar -czf /tmp/StrideProject-source.tar.gz --exclude='*/bin/*' --exclude='*/obj/*' AxiomNext/StrideProject

      - name: Upload Stride source diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AXIOM-ADVENTURE-Stride-source-diagnostics
          path: /tmp/StrideProject-source.tar.gz
          retention-days: 7

      - name: Save generated Stride project to GitHub
        if: success()
        shell: bash
        run: |
          if [ -n "$(git status --porcelain AxiomNext/StrideProject)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add AxiomNext/StrideProject
            git commit -m "Add generated Stride Android project"
            git push origin "HEAD:$GITHUB_REF_NAME"
          else
            echo "Stride project is already up to date."
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AXIOM-ADVENTURE-Stride-Android-APK
          path: AxiomNext/StrideProject/**/*.apk
          if-no-files-found: error
          retention-days: 14
