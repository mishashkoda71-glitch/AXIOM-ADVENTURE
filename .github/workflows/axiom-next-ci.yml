name: AXIOM NEXT - C# validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'AxiomNext/**'
      - '.github/workflows/axiom-next-ci.yml'

permissions:
  contents: read

jobs:
  build-core:
    name: Build C# game core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore AxiomNext/src/AxiomNext.Core/AxiomNext.Core.csproj

      - name: Build
        run: dotnet build AxiomNext/src/AxiomNext.Core/AxiomNext.Core.csproj --configuration Release --no-restore
